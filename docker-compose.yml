# ================================
# Aeon IA — Docker Compose
# Production: Next.js + Ollama (Gemma 4)
# ================================

services:
  aeon-ia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeon-ia
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
    depends_on:
      - ollama
    networks:
      - aeon-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Ollama — Gemma 4 Sovereign AI Engine ──
  ollama:
    image: ollama/ollama:latest
    container_name: aeon-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aeon-network

networks:
  aeon-network:
    driver: bridge

volumes:
  ollama_data:
