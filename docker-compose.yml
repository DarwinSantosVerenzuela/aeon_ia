# ================================
# Aeon IA — Docker Compose (Production)
# Variables inyectadas via GitHub Secrets / .env
# ================================

services:
  aeon-ia:
    image: ghcr.io/darwinsantosverenzuela/aeon_ia:latest
    container_name: aeon-ia
    restart: unless-stopped
    ports:
      - "3009:3000"
    environment:
      - NODE_ENV=production
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
    networks:
      - aeon-network
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  aeon-network:
    driver: bridge
